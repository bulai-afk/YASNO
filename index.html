<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="YASNO — интерактивный прототип кабинета маркетолога. Только вымышленные данные."
    />
    <title>YASNO — ясность в маркетинге</title>
    <style>
      :root {
        --bg: #0b0d10;
        --panel: #111419;
        --raised: #181c23;
        --line: #2d343f;
        --text: #f0f2f5;
        --muted: #a4adbb;
        --blue: #8bb6ff;
        --bluebg: #17243a;
        --green: #89d5b0;
        --orange: #efbb7a;
        --red: #ffa099;
        --radius: 10px;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-size: 16px;
        line-height: 1.5;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a,
      input,
      select {
        outline-offset: 4px;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--blue);
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.55;
      }
      button {
        color: inherit;
      }
      a {
        color: var(--blue);
      }
      button,
      input,
      select {
        min-height: 44px;
      }
      svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        vertical-align: middle;
      }
      button svg {
        pointer-events: none;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 34px;
        line-height: 1.2;
        letter-spacing: -1.1px;
        font-weight: 600;
      }
      h2 {
        font-size: 20px;
        letter-spacing: -0.35px;
        font-weight: 600;
      }
      h3 {
        font-size: 16px;
        font-weight: 600;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 14px;
      }
      .mono {
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 14px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .layout {
        display: grid;
        grid-template-columns: 224px minmax(0, 1fr);
        min-height: 100vh;
      }
      .sidebar {
        border-right: 1px solid var(--line);
        padding: 32px 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 32px;
        background: #0e1014;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 23px;
        font-weight: 650;
        letter-spacing: 3px;
        padding: 0 14px;
      }
      .brandmark {
        width: 30px;
        height: 30px;
      }
      .brandmark svg {
        width: 30px;
        height: 30px;
      }
      .nav-caption {
        padding: 0 14px;
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 14px;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .nav button {
        width: 100%;
        justify-content: flex-start;
        text-align: left;
        background: none;
        border: 1px solid transparent;
        padding: 10px 13px;
        border-radius: 7px;
        font-size: 14px;
        color: var(--muted);
      }
      .nav button:hover {
        background: var(--raised);
        color: var(--text);
      }
      .nav button.active {
        background: #1b2637;
        color: var(--blue);
        border-color: #304666;
      }
      .nav button .count {
        margin-left: auto;
        font-family: Consolas, monospace;
        font-size: 14px;
      }
      .sidebar-bottom {
        margin-top: auto;
      }
      .sandbox-note {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        margin-bottom: 16px;
      }
      .sandbox-note p {
        color: var(--muted);
        font-size: 14px;
        margin-top: 8px;
      }
      .text-btn {
        border: 0;
        background: transparent;
        color: var(--muted);
        padding: 8px;
        font-size: 14px;
      }
      .text-btn:hover {
        color: var(--text);
      }
      .workspace {
        min-width: 0;
      }
      .topbar {
        min-height: 76px;
        padding: 16px 40px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .project-control {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .project-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        background: #232936;
        border: 1px solid #455169;
        border-radius: 7px;
        font-size: 14px;
        color: #c7d6ec;
        flex-shrink: 0;
      }
      .project-control select {
        max-width: 260px;
        min-width: 0;
        background: transparent;
        border: 0;
        color: var(--text);
        font-weight: 500;
        padding: 0 22px 0 0;
      }
      .top-actions {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .badge {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        border: 1px solid var(--line);
        padding: 3px 8px;
        border-radius: 5px;
        font-size: 14px;
        white-space: nowrap;
        color: var(--muted);
      }
      .badge.blue {
        color: var(--blue);
        border-color: #344865;
        background: #142032;
      }
      .badge.green {
        color: var(--green);
        background: #14241d;
        border-color: #2a4839;
      }
      .badge.orange {
        color: var(--orange);
        background: #2a2016;
        border-color: #584129;
      }
      .badge.red {
        color: var(--red);
        background: #291b1b;
        border-color: #5b3836;
      }
      .avatar {
        background: #272d39;
        border: 1px solid #485165;
        width: 44px;
        border-radius: 50%;
        font-size: 14px;
      }
      .menu-btn {
        display: none;
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 7px;
        width: 44px;
      }
      .main {
        padding: 36px 40px 24px;
        max-width: 1560px;
        margin: auto;
      }
      .page-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 28px;
      }
      .eyebrow {
        font:
          14px/1.5 Consolas,
          monospace;
        letter-spacing: 1.6px;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      .page-head p {
        color: var(--muted);
        margin-top: 12px;
      }
      .btn {
        padding: 9px 16px;
        border-radius: 7px;
        border: 1px solid var(--line);
        background: var(--raised);
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
      }
      .btn:hover {
        border-color: #68778d;
        background: #222a35;
      }
      .btn.primary {
        background: #dfeaff;
        border-color: #dfeaff;
        color: #12223a;
      }
      .btn.primary:hover {
        background: #c8dcff;
      }
      .btn.danger {
        color: var(--red);
      }
      .btn.ghost {
        background: transparent;
      }
      .head-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        padding-top: 22px;
      }
      .select {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--line);
        padding: 8px 12px;
        border-radius: 7px;
        font-size: 14px;
      }
      .demo-strip {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 14px;
        padding-bottom: 20px;
      }
      .demo-strip svg {
        width: 16px;
        height: 16px;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 24px;
      }
      .metric {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 20px;
        background: var(--panel);
      }
      .metric-label {
        color: var(--muted);
        font-size: 14px;
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .metric-label svg {
        width: 17px;
        height: 17px;
      }
      .metric-value {
        font-size: 32px;
        line-height: 1.2;
        letter-spacing: -1px;
        font-weight: 550;
        margin: 12px 0;
      }
      .metric-foot {
        font-size: 14px;
        color: var(--muted);
      }
      .metric-foot .good {
        color: var(--green);
      }
      .overview-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.55fr) minmax(280px, 1fr);
        gap: 24px;
        margin-bottom: 24px;
      }
      .insight {
        border: 1px solid #38485d;
        border-radius: 10px;
        padding: 28px;
        position: relative;
        overflow: hidden;
        background: linear-gradient(125deg, #18212e, #111419 72%);
      }
      .insight .eyebrow {
        color: var(--blue);
        margin-bottom: 20px;
      }
      .insight h2 {
        font-size: 27px;
        letter-spacing: -0.8px;
        max-width: 550px;
        line-height: 1.3;
      }
      .insight p {
        color: #b7c3d3;
        margin-top: 16px;
        font-size: 15px;
        max-width: 590px;
      }
      .insight .btn {
        margin-top: 24px;
      }
      .rule {
        display: block;
        font:
          14px Consolas,
          monospace;
        color: var(--muted);
        margin-top: 20px;
      }
      .panel {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        overflow: hidden;
        min-width: 0;
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 20px 24px;
        border-bottom: 1px solid var(--line);
      }
      .panel-body {
        padding: 24px;
      }
      .source-row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 22px;
        border-bottom: 1px solid var(--line);
      }
      .source-row:last-child {
        border-bottom: 0;
      }
      .source-row .source-text {
        flex: 1;
      }
      .source-row p {
        font-size: 14px;
        color: var(--muted);
      }
      .source-logo {
        width: 38px;
        height: 38px;
        border: 1px solid #5b4139;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: #2b1b17;
        font-size: 20px;
        font-weight: 600;
        color: #ffb19b;
        flex-shrink: 0;
      }
      .source-logo.google {
        border-color: #38414f;
        background: #1b222c;
        color: #bdcbe1;
      }
      .source-row .badge {
        font-size: 14px;
      }
      .bottom-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.55fr) minmax(280px, 1fr);
        gap: 24px;
      }
      .table-wrap {
        overflow-x: auto;
      }
      .scroll-hint {
        display: none;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 14px;
      }
      th {
        font-weight: 450;
        color: var(--muted);
        text-align: left;
        font-size: 14px;
        background: #14181f;
      }
      td,
      th {
        padding: 15px 22px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      th.num,
      td.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      .channel {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .channel:before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 2px;
        background: var(--blue);
      }
      tr:nth-child(2) .channel:before {
        background: #efc97d;
      }
      tr:nth-child(3) .channel:before {
        background: #bd9fe8;
      }
      .task-short {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 18px 22px;
        border-bottom: 1px solid var(--line);
      }
      .task-short:last-child {
        border: 0;
      }
      .task-short .number {
        font:
          14px Consolas,
          monospace;
        color: var(--muted);
        padding-top: 4px;
      }
      .task-short p {
        font-size: 14px;
        color: var(--muted);
        margin-top: 4px;
      }
      .task-short button {
        padding: 0;
        min-height: 44px;
        text-align: left;
        background: none;
        border: none;
        justify-content: flex-start;
        font-weight: 500;
        font-size: 14px;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-top: 28px;
        color: var(--muted);
        font-size: 14px;
        border-top: 1px solid var(--line);
        padding-top: 20px;
      }
      .dot {
        width: 6px;
        height: 6px;
        display: inline-block;
        background: var(--green);
        border-radius: 50%;
        margin-right: 8px;
      }
      .notice {
        border: 1px solid var(--line);
        background: var(--panel);
        padding: 18px 20px;
        border-radius: 8px;
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 24px;
      }
      .notice strong {
        color: var(--text);
        font-weight: 500;
      }
      .connections {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }
      .connection {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 10px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }
      .connection-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        gap: 8px;
      }
      .connection h2 {
        margin-top: 4px;
      }
      .connection p {
        font-size: 14px;
        color: var(--muted);
        flex: 1;
      }
      .connection .btn {
        width: 100%;
        margin-top: 8px;
      }
      .section-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 28px 0 16px;
        gap: 16px;
      }
      .filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }
      .filters button {
        border: 1px solid var(--line);
        background: transparent;
        padding: 8px 14px;
        border-radius: 7px;
        font-size: 14px;
        color: var(--muted);
      }
      .filters button.active {
        color: var(--text);
        border-color: #5c708b;
        background: #202b3c;
      }
      .list {
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
      }
      .issue {
        display: grid;
        grid-template-columns: 76px minmax(0, 1fr) auto;
        gap: 20px;
        align-items: center;
        padding: 22px 24px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      .issue:last-child {
        border-bottom: 0;
      }
      .issue .badge {
        justify-content: center;
      }
      .issue h3 {
        margin-bottom: 6px;
      }
      .issue p {
        color: var(--muted);
        font-size: 14px;
      }
      .issue .btn {
        white-space: nowrap;
      }
      .task-tools {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .task-tools select {
        max-width: 172px;
      }
      .empty {
        padding: 48px 24px;
        text-align: center;
        border: 1px dashed #46536a;
        border-radius: 10px;
      }
      .empty > svg {
        width: 32px;
        height: 32px;
        color: var(--blue);
        margin-bottom: 14px;
      }
      .empty h2 {
        margin-bottom: 12px;
      }
      .empty p {
        color: var(--muted);
        max-width: 500px;
        margin: 0 auto 20px;
      }
      .two-col {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(260px, 1fr);
        gap: 24px;
      }
      .rule-card {
        padding: 22px;
        border-bottom: 1px solid var(--line);
      }
      .rule-card:last-child {
        border: 0;
      }
      .rule-card p {
        font-size: 14px;
        color: var(--muted);
        margin-top: 8px;
      }
      .numbered {
        font-family: Consolas, monospace;
        color: var(--blue);
        margin-right: 8px;
      }
      .project-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }
      .project-card {
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
      }
      .project-card h2 {
        margin: 20px 0 8px;
      }
      .project-card p {
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 24px;
      }
      .project-card .project-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .project-card .btn {
        width: 100%;
      }
      .progress-label {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-size: 14px;
        margin-bottom: 12px;
      }
      .progress-track {
        height: 6px;
        background: #303746;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 24px;
      }
      .progress-track div {
        height: 100%;
        background: var(--blue);
      }
      dialog {
        background: var(--panel);
        color: var(--text);
        border: 1px solid #46536a;
        border-radius: 12px;
        padding: 0;
        width: min(580px, calc(100% - 32px));
        max-height: 90vh;
        overflow: auto;
        box-shadow: 0 32px 100px #0009;
      }
      dialog::backdrop {
        background: #000b;
        backdrop-filter: blur(5px);
      }
      .dialog-head {
        padding: 20px 24px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .icon-btn {
        width: 44px;
        border: 1px solid var(--line);
        background: transparent;
        border-radius: 7px;
        flex-shrink: 0;
      }
      .dialog-body {
        padding: 24px;
      }
      .dialog-body p {
        color: var(--muted);
        margin-bottom: 16px;
        font-size: 15px;
      }
      .dialog-body ul,
      .dialog-body ol {
        padding-left: 22px;
        font-size: 15px;
        color: #c3cbd6;
        margin: 16px 0 24px;
      }
      .dialog-body li {
        margin: 10px 0;
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 24px;
      }
      .field {
        margin-bottom: 20px;
      }
      .field label {
        display: block;
        font-size: 14px;
        margin-bottom: 8px;
      }
      .input {
        width: 100%;
        background: var(--bg);
        border: 1px solid #49566a;
        border-radius: 7px;
        color: var(--text);
        padding: 12px 14px;
      }
      .field .hint {
        font-size: 14px;
        margin: 8px 0 0;
        color: var(--muted);
      }
      .error {
        color: var(--red) !important;
        font-size: 14px;
        min-height: 20px;
        margin: 12px 0;
      }
      .auth-layout {
        display: grid;
        grid-template-columns: 1.05fr 1fr;
        min-height: 100vh;
      }
      .auth-brand {
        background: #101722;
        border-right: 1px solid #2e3c51;
        padding: 48px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 56px;
      }
      .auth-brand .brand {
        padding: 0;
      }
      .auth-brand h1 {
        font-size: clamp(38px, 4vw, 58px);
        letter-spacing: -2px;
        max-width: 520px;
        line-height: 1.13;
      }
      .auth-brand p {
        color: #a9b8cc;
        max-width: 440px;
        margin-top: 24px;
        font-size: 18px;
      }
      .auth-points {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-top: 40px;
      }
      .auth-points span {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #c3d4ec;
      }
      .auth-points svg {
        color: var(--blue);
      }
      .auth-side {
        display: flex;
        align-items: center;
        justify-content: center;

          openDialog(
            i.title,
            `${badge(i.priority)} <span class="small muted">${i.kind} · Оценка: ${i.effort}</span><div class="section-label"><h3>Что найдено — демо</h3></div><p>${i.summary}. Это пример для atelier.example, не результат сканирования вашего сайта.</p><div class="issue-context">${esc(i.evidence).replace(/\n/g, "<br>")}</div><h3>Почему это важно</h3><p style="margin-top:8px">${i.why}</p><h3>План исправления</h3><ol>${i.steps.map((s) => `<li>${s}</li>`).join("")}</ol><h3>Критерий готовности</h3><p style="margin-top:8px">${i.criterion}</p><div class="dialog-actions">${exists ? `<button class="btn danger" data-action="remove-task" data-id="${id}">Убрать из плана</button><button class="btn primary" data-nav="plan">Открыть план ${icon("arrow")}</button>` : `<button class="btn primary" data-action="add-task" data-id="${id}">${icon("plus")}Добавить в план</button>`}</div>`,
          );
        }
        function connectDialog(id) {
          const s = SOURCES.find((x) => x.id === id);
          if (!s) return;
          const active = project().connected[id];
          openDialog(
            s.name,
            `<div class="notice"><strong>Только симуляция.</strong> Никаких реальных разрешений, токенов и перехода в Яндекс.</div><p>${s.detail}</p><h3>Планируемый доступ в рабочей версии</h3><p style="margin-top:8px">${s.scope}</p><div class="field"><label for="demo-account">${s.unit} для демо</label><select class="input" id="demo-account"><option>${esc(project().domain)} · демонстрационный</option></select></div><p>Включение добавит вымышленные данные в проект. Отключение уберёт статус источника; ваши локальные задачи останутся.</p><div class="dialog-actions"><button class="btn" data-action="close">Отмена</button><button class="btn ${active ? "danger" : "primary"}" data-action="toggle-source" data-id="${id}">${active ? "Отключить демо-источник" : "Включить демо-источник"}</button></div>`,
          );
        }
        function addProjectDialog() {
          openDialog(
            "Новый проект",
            `<p>Добавьте сайт в локальный прототип. Домен не проверяется через интернет; подключения останутся демонстрационными.</p><form id="project-form"><div class="field"><label for="project-name">Название проекта</label><input id="project-name" name="projectName" class="input" placeholder="Например, мой магазин" required maxlength="60"></div><div class="field"><label for="project-domain">Домен сайта</label><input id="project-domain" name="domain" class="input" placeholder="example.ru" required maxlength="253" autocapitalize="none" spellcheck="false" aria-describedby="project-error"></div><p id="project-error" class="error" role="alert"></p><div class="dialog-actions"><button class="btn" type="button" data-action="close">Отмена</button><button class="btn primary" type="submit">Создать проект ${icon("arrow")}</button></div></form>`,
          );
        }
        function scopeDialog() {
          openDialog(
            "Что работает в прототипе",
            `<p>Версия для согласования интерфейса и логики. Не готовый SaaS и не подключение к вашим данным.</p><div class="scope-list"><div><h3>Работает локально</h3><p>Навигация, демо-вход, переключение и добавление проектов, фильтры, симуляция подключений и аудита, задачи со статусами, экспорт плана.</p></div><div><h3>Не реализовано</h3><p>Настоящие письма и авторизация, OAuth, API Яндекса, сканирование сайтов, серверная база, фоновые синхронизации, Google и совместный доступ.</p></div><div><h3>Без дополнительных расходов</h3><p>Прототип не использует внешние сервисы. Для SaaS нужны бесплатные лимиты хостинга и почтового провайдера, а также одобрение нужных API. Бесконечная бесплатная нагрузка не обещается.</p></div><div><h3>Хранение</h3><p>Проекты и статусы сохраняются только в браузере, если хранилище доступно. Email не сохраняется. Не вводите персональные данные и секреты.</p></div></div><div class="dialog-actions"><button class="btn" data-action="reset">Сбросить демо</button><button class="btn primary" data-action="close">Понятно</button></div>`,
          );
        }
        function doAction(action, id) {
          switch (action) {
            case "close":
              modal.close();
              break;
            case "menu":
              menu = !menu;
              render();
              break;
            case "profile":
              openDialog(
                "Личный кабинет",
                `<p>Вы находитесь в открытом демо-кабинете. Посмотрите сценарий входа по одноразовому коду; он не создаёт реальную сессию.</p><div class="dialog-actions"><button class="btn" data-action="scope">О прототипе</button><button class="btn primary" data-action="login">Проверить вход ${icon("arrow")}</button></div>`,
              );
              break;
            case "login":
              loginStep = 1;
              navigate("login");
              break;
            case "back-email":
              loginStep = 1;
              render();
              document.getElementById("email").focus();
              break;
            case "issue":
              issueDialog(id);
              break;
            case "connect":
              connectDialog(id);
              break;
            case "toggle-source":
              project().connected[id] = !project().connected[id];
              save();
              modal.close();
              render();
              toast(
                project().connected[id]
                  ? "Демо-источник включён. Реального подключения нет."
                  : "Демо-источник отключён.",
              );
              break;
            case "add-task":
              project().tasks[id] = "todo";
              save();
              modal.close();
              render();
              toast("Задача добавлена в план работ");
              break;
            case "remove-task":
              delete project().tasks[id];
              save();
              modal.close();
              render();
              toast("Задача убрана из плана");
              break;
            case "scan":
              openDialog(
                "Запустить демонстрационный аудит?",
                `<p>Мы не будем обращаться к ${esc(project().domain)}. Покажем готовый набор из 6 примеров ошибок сайта atelier.example.</p><p>В рабочем продукте аудит будет проверять только разрешённые публичные страницы, с ограничением частоты и защитой от запросов во внутреннюю сеть.</p><div class="dialog-actions"><button class="btn" data-action="close">Отмена</button><button class="btn primary" data-action="confirm-scan">Показать демо-результат</button></div>`,
              );
              break;
            case "confirm-scan":
              project().scanned = true;
              save();
              modal.close();
              render();
              toast("Демо-аудит готов: 6 примеров, реального сканирования не было.");
              break;
            case "add-project":
              addProjectDialog();
              break;
            case "select-project":
              state.current = id;
              save();
              navigate("overview");
              break;
            case "scope":
              scopeDialog();
              break;
            case "reset":
              if (modal.open) modal.close();
              openDialog(
                "Сбросить демонстрацию?",
                `<p>Локальные проекты и статусы задач будут удалены. Останутся два исходных демо-проекта. Это действие нельзя отменить.</p><div class="dialog-actions"><button class="btn" data-action="close">Отмена</button><button class="btn danger" data-action="confirm-reset">Сбросить</button></div>`,
              );
              break;
            case "confirm-reset":
              state = seed();
              period = "30";
              auditFilter = taskFilter = trafficFilter = "all";
              email = "";
              loginStep = 1;
              save();
              modal.close();
              navigate("overview");
              toast("Демонстрация сброшена");
              break;
            case "export": {
              const p = project(),
                labels = { todo: "К работе", doing: "В работе", done: "Готово" },
                text =
                  `YASNO — демонстрационный план работ\nПроект: ${p.name} (${p.domain})\nВнимание: вымышленные примеры для atelier.example, не реальные результаты аудита.\n\n` +
                  ISSUES.filter((i) => p.tasks[i.id])
                    .map(
                      (i) =>
                        `${i.priority} · ${i.title}\nСтатус: ${labels[p.tasks[i.id]]}\nОценка: ${i.effort}\n${i.steps.map((s, n) => `${n + 1}. ${s}`).join("\n")}\nГотово, когда: ${i.criterion}`,
                    )
                    .join("\n\n");
              const url = URL.createObjectURL(
                  new Blob(["\ufeff" + text], { type: "text/plain;charset=utf-8" }),
                ),
                a = document.createElement("a");
              a.href = url;
              a.download = "yasno-demo-plan.txt";
              document.body.append(a);
              a.click();
              a.remove();
              setTimeout(() => URL.revokeObjectURL(url), 1000);
              toast("Демо-план подготовлен к скачиванию");
              break;
            }
          }
        }
        document.addEventListener("click", (event) => {
          const nav = event.target.closest("[data-nav]");
          if (nav) {
            navigate(nav.dataset.nav);
            return;
          }
          const action = event.target.closest("[data-action]");
          if (action) {
            doAction(action.dataset.action, action.dataset.id);
            return;
          }
          for (const [attr, setter] of [
            ["auditFilter", (v) => (auditFilter = v)],
            ["taskFilter", (v) => (taskFilter = v)],
            ["trafficFilter", (v) => (trafficFilter = v)],
          ]) {
            const button = event.target.closest(
              "[data-" + attr.replace(/[A-Z]/g, (c) => "-" + c.toLowerCase()) + "]",
            );
            if (button) {
              setter(button.dataset[attr]);
              render();
              const restored = document.querySelector(
                `[data-${attr.replace(/[A-Z]/g, (c) => "-" + c.toLowerCase())}="${button.dataset[attr]}"]`,
              );
              restored?.focus();
              return;
            }
          }
        });
        document.addEventListener("change", (event) => {
          if (event.target.id === "project-select") {
            state.current = event.target.value;
            save();
            render();
            document.getElementById("project-select").focus();
          }
          if (event.target.id === "period") {
            period = event.target.value;
            render();
            document.getElementById("period").focus();
          }
          if (event.target.dataset.taskStatus) {
            const id = event.target.dataset.taskStatus;
            project().tasks[id] = event.target.value;
            save();
            render();
            document.getElementById("task-" + id)?.focus();
            toast("Статус задачи сохранён");
          }
        });
        document.addEventListener("submit", (event) => {
          if (event.target.id === "login-form") {
            event.preventDefault();
            if (loginStep === 1) {
              email = new FormData(event.target).get("email").trim();
              loginStep = 2;
              render();
              document.getElementById("code").focus();
            } else {
              const code = new FormData(event.target).get("code");
              if (code !== "123456") {
                document.getElementById("auth-error").textContent = "Это демо: введите код 123456.";
                document.getElementById("code").setAttribute("aria-invalid", "true");
              } else {
                navigate("overview");
                toast("Демо-вход выполнен. Реальной авторизации нет.");
              }
            }
          }
          if (event.target.id === "project-form") {
            event.preventDefault();
            const f = new FormData(event.target),
              name = f.get("projectName").trim(),
              raw = f.get("domain").trim();
            let domain;
            try {
              const u = new URL(/^[a-z]+:\/\//i.test(raw) ? raw : "https://" + raw);
              domain = u.hostname;
              if (
                !["http:", "https:"].includes(u.protocol) ||
                !domain.includes(".") ||
                domain.length > 253 ||
                u.username ||
                u.password ||
                !domain.split(".").every((s) => /^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/i.test(s))
              )
                throw Error();
              if (!name) throw Error();
            } catch {
              document.getElementById("project-error").textContent =
                "Укажите название и корректный домен, например example.ru.";
              return;
            }
            if (state.projects.some((p) => p.domain === domain)) {
              document.getElementById("project-error").textContent =
                "Проект с таким доменом уже существует.";
              return;
            }
            const id = "project-" + Date.now();
            state.projects.push({
              id,
              name,
              domain,
              factor: 1,
              seed: false,
              connected: { metrika: false, webmaster: false, direct: false },
              tasks: {},
              scanned: false,
            });
            state.current = id;
            save();
            modal.close();
            navigate("sources");
            toast("Проект создан локально. Настройте демо-источники.");
          }
        });
        window.addEventListener("hashchange", () => {
          const next = location.hash.slice(1);
          if (validRoutes.includes(next)) navigate(next);
        });
        render();
      })();
    </script>
  </body>
</html>
